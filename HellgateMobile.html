<style>
/* Layout: a fixed 16:10 game screen + steel status bar; landscape puts touch pads either side, portrait stacks pads below */
:root{
  --bg:#0a0706; --fg:#eadfcb; --steel:#2b2622; --steel-hi:#4d443d; --steel-lo:#171311;
  --blood:#d8361a; --ember:#f2a03a; --dim:#8f8070; --ok:#8fc65a; --gold:#ffd27a;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;display:grid;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#app.land{grid-template-columns:1fr auto 1fr;grid-template-rows:1fr;grid-template-areas:"l f r";align-items:center}
#app.port{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"f f" "l r";align-items:stretch}
#frame{grid-area:f;justify-self:center;position:relative;width:640px;max-width:100%;container-type:inline-size;box-shadow:0 0 0 1px var(--steel-lo),0 20px 60px rgba(0,0,0,.6)}
#app.port #frame{align-self:start}
#screen{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#000}
#view{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--blood);mix-blend-mode:multiply}
#msg{position:absolute;left:1.4cqw;top:1cqw;font:600 max(11px,1.9cqw)/1.35 var(--body);color:var(--gold);text-shadow:0 1px 0 #000;pointer-events:none;max-width:70%}
#center{position:absolute;left:0;right:0;top:42%;text-align:center;font:max(12px,2.6cqw) var(--display);color:var(--ember);text-shadow:0 2px 0 #000;pointer-events:none}
#bar{display:grid;grid-template-columns:13fr 14fr 13fr 11fr 14fr 22fr;aspect-ratio:10/1;
  background:linear-gradient(var(--steel-hi),var(--steel) 12%,var(--steel) 85%,var(--steel-lo));gap:.35cqw;padding:.45cqw;box-sizing:border-box}
.cell{position:relative;background:linear-gradient(#1d1916,#120f0d);border:.18cqw solid var(--steel-lo);border-top-color:#000;border-bottom-color:var(--steel-hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:.2cqw}
.cell b{font:3.6cqw/1 var(--display);color:var(--blood);text-shadow:0 0 .8cqw rgba(216,54,26,.45);font-variant-numeric:tabular-nums}
.cell span{font:700 1.15cqw/1 var(--body);letter-spacing:.25em;color:var(--dim)}
#h-arms{display:grid;grid-template-columns:repeat(3,1fr);gap:.2cqw .7cqw;font:700 1.6cqw/1 var(--body);font-variant-numeric:tabular-nums}
#h-arms i{font-style:normal;color:#4a4139}
#h-arms i.on{color:var(--gold)}
#h-arms i.cur{color:var(--ember);text-decoration:underline}
#h-keys{display:flex;gap:.6cqw}
.k{display:block;width:1.3cqw;height:2cqw;border-radius:.2cqw;border:.15cqw solid #000;opacity:.12}
.k.r{background:#e2342a}.k.b{background:#3a66ff}.k.y{background:#f2cf34}
.k.on{opacity:1}
#h-lvl{font-size:1cqw;letter-spacing:.15em}
.tbl{align-items:stretch;padding:0 1.2cqw;font:600 1.35cqw/1.35 var(--body);font-variant-numeric:tabular-nums}
.tbl div{display:flex;justify-content:space-between;color:#c9b99f}
.tbl em{font-style:normal;color:var(--gold)}

/* touch pads */
.pad{position:relative;min-width:0;min-height:0;display:none}
body.touch .pad{display:block}
#padL{grid-area:l;align-self:stretch}
#padR{grid-area:r;align-self:stretch}
body.touch #padR{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto;gap:10px;place-items:center;padding-block:4px}
.stick{position:absolute;width:clamp(96px,30vmin,150px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);left:50%;top:55%;
  border:2px dashed rgba(255,210,122,.35);background:radial-gradient(rgba(255,210,122,.08),rgba(255,210,122,.02));pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,210,122,.28);border:2px solid rgba(255,210,122,.6)}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:600 11px var(--body);color:var(--dim);letter-spacing:.15em;pointer-events:none}
.tb{border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,210,122,.4);color:var(--gold);
  font:700 clamp(12px,3.6vmin,16px) var(--body);display:flex;align-items:center;justify-content:center;width:clamp(52px,15vmin,72px);aspect-ratio:1;touch-action:none}
.tb:active,.tb.down{background:rgba(255,160,60,.3)}
.tb.sm{width:clamp(42px,11vmin,54px);font-size:12px}
#t-fire{grid-column:1/3;width:clamp(78px,24vmin,112px);background:rgba(216,54,26,.28);border-color:rgba(255,120,60,.7);font-size:clamp(14px,4vmin,19px)}
#turnzone{grid-column:1/3;align-self:stretch;justify-self:stretch;display:flex;align-items:center;justify-content:center;font:600 11px var(--body);color:var(--dim);letter-spacing:.15em;border:1px dashed rgba(143,128,112,.25);border-radius:12px;min-height:30px}

/* menus cover the whole viewport */
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(60,8,2,.6),rgba(5,2,1,.94))}
.panel{text-align:center;max-width:680px;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vmin,18px);margin:auto}
.logo{font:clamp(30px,9vmin,72px)/0.92 var(--display);color:var(--blood);text-shadow:0 4px 0 #3b0a02,0 0 24px rgba(216,54,26,.5);text-wrap:balance}
.logo small{display:block;font-size:.3em;color:var(--ember);letter-spacing:.35em;margin-top:8px;text-shadow:none}
.logo.s{font-size:clamp(26px,7vmin,52px)}
.sub{font:500 clamp(12px,2.6vmin,15px)/1.55 var(--body);color:#cdbda6;max-width:52ch;text-wrap:balance}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:700 clamp(14px,3vmin,17px)/1 var(--body);letter-spacing:.06em;color:var(--fg);background:linear-gradient(#5a1c10,#2c0c06);
  border:2px solid #8a2d18;padding:12px 18px;cursor:pointer;border-radius:3px;min-height:44px}
.btn:hover,.btn:focus-visible{background:linear-gradient(#8a2a14,#46120a);border-color:var(--ember);outline:none}
.btn small{display:block;font-weight:500;font-size:12px;color:#e8b38a;margin-top:5px;letter-spacing:0}
.btn.ghost{background:transparent;border-color:#4d443d;color:#cdbda6}
.btn.big{padding:14px 26px;border-color:var(--ember)}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.mode{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(#24110b,#120806);border:2px solid #5a2414;border-radius:6px;cursor:pointer;color:var(--fg);font:700 16px var(--body);min-width:130px}
.mode:hover,.mode:focus-visible,.mode.last{border-color:var(--ember);outline:none}
.mode small{font-weight:500;font-size:12px;color:var(--dim)}
.phone{border:3px solid #8f8070;border-radius:9px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding:4px}
.phone i{display:block;background:var(--blood);aspect-ratio:16/10;width:100%;border-radius:2px;box-shadow:0 3px 0 #3a2f28}
.phone.l{width:96px;height:52px;align-items:center;padding:4px 18px}
.phone.l i{width:auto;height:100%}
.phone.p{width:52px;height:96px}
.save{font:600 13px/1.5 var(--body);color:var(--gold)}
.keys{font:500 13px/1.6 var(--body);color:var(--dim);columns:2;column-gap:28px;text-align:left}
.keys kbd{font:700 12px var(--body);color:var(--gold);background:#241c17;border:1px solid #4d443d;padding:0 5px;border-radius:3px}
body.touch .keys{display:none}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 40px;font:clamp(16px,4vmin,22px) var(--display);font-variant-numeric:tabular-nums}
.stats span:nth-child(odd){color:#cdbda6;text-align:left}
.stats span:nth-child(even){text-align:right;color:var(--blood)}
@media (prefers-reduced-motion: reduce){#flash{transition:none}}
</style>

<script>
"use strict";
// ===== core & procedural textures =====
const W=384,H=240,HALF=H/2,PLANE=0.66,K=W/(2*PLANE);
const cv=document.getElementById('view'),ctx=cv.getContext('2d');
const IMG=ctx.createImageData(W,H),BUF=new Uint32Array(IMG.data.buffer),ZB=new Float32Array(W);
const rgb=(r,g,b)=>((255<<24)|(b<<16)|(g<<8)|r)>>>0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=Math.random, ri=(a,b)=>a+Math.floor(rand()*(b-a+1));
function hash(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,p,s){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const m=a=>((a%p)+p)%p;const a=hash(m(x0),m(y0),s),b=hash(m(x0+1),m(y0),s),c=hash(m(x0),m(y0+1),s),d=hash(m(x0+1),m(y0+1),s);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
function fbm(x,y,s){let v=0,amp=.5,f=4;for(let i=0;i<4;i++){v+=amp*vnoise(x*f/64,y*f/64,f,s+i*7);amp*=.5;f*=2}return v/.9375}
function tex(fn){const t=new Uint32Array(4096);for(let y=0;y<64;y++)for(let x=0;x<64;x++){const c=fn(x,y);t[y*64+x]=rgb(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255))}return t}
const un=c=>[c&255,(c>>8)&255,(c>>16)&255];
const T={};
T.brick=tex((x,y)=>{const row=y>>3,off=(row&1)?8:0,bx=(x+off)&15,by=y&7,n=fbm(x,y,3);
  if(by===7||bx===15)return[38+n*20,30+n*14,24];const b=hash((x+off)>>4,row,7),s=72+b*36+n*52;

function makeSky(top,bot,mtn,s){const w=512,h=128,t=new Uint32Array(w*h);for(let x=0;x<w;x++){
  const mh=78+22*vnoise(x/32,.5,16,s)+9*vnoise(x/8,.5,64,s+3);
  for(let y=0;y<h;y++){let c;if(y>mh){const k=.55+.45*vnoise(x/6,y/6,85,s+9);c=mtn.map(v=>v*k*(1-(y-mh)/140))}
    else{const k=y/h,cl=vnoise(x/24,y/10,22,s+5);c=top.map((v,i)=>v+(bot[i]-v)*k+(cl>.62?(cl-.62)*120:0))}
    t[y*w+x]=rgb(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255))}}return t}

  g.fillStyle=p.body;g.fillRect(cx-10,h-46,20,24);g.fillStyle=p.belt||'#2a2016';g.fillRect(cx-10,h-26,20,4);
  g.fillStyle=p.trim||'rgba(0,0,0,.25)';g.fillRect(cx-10,h-46,20,3);
  if(p.spikes){g.fillStyle=p.spikes;for(let i=0;i<4;i++){g.beginPath();g.moveTo(cx-10+i*6,h-46);g.lineTo(cx-7+i*6,h-54);g.lineTo(cx-4+i*6,h-46);g.fill()}}
  g.fillStyle=p.skin;g.beginPath();g.arc(cx,h-52,7,0,7);g.fill();
  g.fillStyle=p.eye;g.fillRect(cx-5,h-54,4,2);g.fillRect(cx+1,h-54,4,2);
  if(p.mouth){g.fillStyle=p.mouth;g.fillRect(cx-3,h-49,6,2)}

  if(p.gun){g.fillRect(cx-14,h-44,5,14);g.fillRect(cx+9,h-44,5,10);g.fillStyle=p.gun;g.fillRect(cx-4,h-38,18,4);g.fillRect(cx+6,h-36,3,6);
    if(f==='atk'){g.fillStyle='#fff3a0';g.beginPath();g.arc(cx+17,h-36,5,0,7);g.fill();g.fillStyle='#ff9a20';g.beginPath();g.arc(cx+17,h-36,3,0,7);g.fill()}}

const SKYCOL=new Float32Array(W);
function render(){
  const px=P.x,py=P.y,dx=Math.cos(P.a),dy=Math.sin(P.a),plx=-dy*PLANE,ply=dx*PLANE;
  const fb=1+P.flash*.6,tm=G.time,sky=SKIES[LV.sky],anim=(tm*6)|0;
  const fTex=T[LV.floor],cTex=T[LV.ceil],oTex=T[LV.out];
  for(let x=0;x<W;x++){const cx=2*x/W-1;let a=(P.a+Math.atan(cx*PLANE))/(Math.PI*2);a-=Math.floor(a);SKYCOL[x]=(a*1024)&511}
  // floor & ceiling
  const r0x=dx-plx,r0y=dy-ply,r1x=dx+plx,r1y=dy+ply;
  for(let y=0;y<H;y++){
    const flo=y>HALF,p=flo?y-HALF+.5:HALF-y-.5,rd=(.5*K)/p;
    const sx=rd*(r1x-r0x)/W,sy=rd*(r1y-r0y)/W;let fx=px+rd*r0x,fy=py+rd*r0y;
    const sh=fb/(1+rd*rd*.018),row=y*W,skyY=(y*128/HALF)|0;
    for(let x=0;x<W;x++,fx+=sx,fy+=sy){
      const cxi=fx|0,cyi=fy|0;let c=0xff000000,s=0;
      if(cxi>=0&&cyi>=0&&cxi<MW&&cyi<MH){const ci=cyi*MW+cxi,ft=FT[ci];
        let tx=((fx-cxi)*64)&63,ty=((fy-cyi)*64)&63;
        if(flo){let t;if(ft===2||ft===3){t=ft===2?T.nuk:T.lava;tx=(tx+anim)&63;ty=(ty+(anim>>1))&63;s=256*(ft===3?1.1:sh*LIT[ci]+.15)}else{t=ft===1?oTex:fTex;s=256*sh*LIT[ci]}c=t[ty*64+tx]}
        else{if(ft===1){BUF[row+x]=sky[(skyY>127?127:skyY)*512+SKYCOL[x]];continue}c=cTex[ty*64+tx];s=256*sh*LIT[ci]}}
      let r=((c&255)*s)>>8,g=(((c>>8)&255)*s)>>8,b=(((c>>16)&255)*s)>>8;
      BUF[row+x]=0xff000000|(b>255?255:b)<<16|(g>255?255:g)<<8|(r>255?255:r)}}
  // walls
  for(let x=0;x<W;x++){
    const cam=2*x/W-1,rx=dx+plx*cam,ry=dy+ply*cam;let mx=px|0,my=py|0;
    const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),stx=rx<0?-1:1,sty=ry<0?-1:1;
    let sdx=rx<0?(px-mx)*ddx:(mx+1-px)*ddx,sdy=ry<0?(py-my)*ddy:(my+1-py)*ddy;
    let side=0,dist=1e9,u=0,tx=null,ci=0;
    for(let it=0;it<80;it++){
      if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}
      if(mx<0||my<0||mx>=MW||my>=MH)break;
      ci=my*MW+mx;const k=KIND[ci];if(!k)continue;SEEN[ci]=1;
      if(k===2&&!(DOORS.get(ci).secret&&DOORS.get(ci).open===0)){const d=DOORS.get(ci);let dd,wx;
        if(side===0){dd=sdx-ddx*.5;wx=py+dd*ry;if(Math.floor(wx)!==my)continue}else{dd=sdy-ddy*.5;wx=px+dd*rx;if(Math.floor(wx)!==mx)continue}
        const f=wx-Math.floor(wx);if(f<d.open)continue;u=f-d.open;dist=dd;tx=d.tex;break}
      dist=side===0?sdx-ddx:sdy-ddy;const wx=side===0?py+dist*ry:px+dist*rx;u=wx-Math.floor(wx);
      if((side===0&&rx<0)||(side===1&&ry>0))u=1-u;tx=k===2?DOORS.get(ci).tex:WTEX[ci];
      break}
    ZB[x]=dist;if(!tx)continue;
    const lh=K/dist,top=HALF-lh/2,y0=Math.max(0,Math.ceil(top)),y1=Math.min(H,Math.ceil(HALF+lh/2)),tu=(u*64)&63;

    for(let y=y0;y<y1;y++){const tv=((y-top)/lh*64)&63,c=tx[tv*64+tu];
      let r=((c&255)*s)>>8,g=(((c>>8)&255)*s)>>8,b=(((c>>16)&255)*s)>>8;BUF[y*W+x]=0xff000000|(b>255?255:b)<<16|(g>255?255:g)<<8|(r>255?255:r)}}
  // sprites

  for(const e of ENTS){
    if(e.cls==='mon'){const D=MON[e.type],S=SPR[e.type];let s;

// ===== world queries =====
const NIGHT=()=>G.skill===2;

function blocked(x,y,r,self){

  return false}
function tryMove(o,nx,ny){let m=false;if(!blocked(nx,o.y,o.r,o)){o.x=nx;m=true}if(!blocked(o.x,ny,o.r,o)){o.y=ny;m=true}return m}
function opaque(x,y){if(x<0||y<0||x>=MW||y>=MH)return true;const ci=(y|0)*MW+(x|0),k=KIND[ci];return k===1||k===3||(k===2&&DOORS.get(ci).open<.6)}
function los(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),n=Math.ceil(d*5);for(let i=1;i<n;i++){const t=i/n;if(opaque(a.x+dx*t,a.y+dy*t))return false}return true}

// ===== doors =====

// ===== flow field (monster pathing toward the player) =====
function computeFlow(){const f=new Int16Array(MW*MH).fill(-1),q=[(P.y|0)*MW+(P.x|0)];f[q[0]]=0;

    const k=KIND[n];if(k===1||k===3)continue;if(k===2){const d=DOORS.get(n);if(d.key||(d.secret&&d.open<.85))continue}f[n]=f[c]+1;q.push(n)}}FLOW=f}

  for(let h=0;h<q.length;h++){const c=q[h];if(depth[c]>22)continue;const x=c%MW,y=c/MW|0;for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=(y+ay)*MW+x+ax;if(seen[n])continue;

// ===== combat =====
function wake(e){if(e.st!=='idle')return;e.st='chase';e.cd=.4+rand()*.6;sfx('sight',e)}

  if(P.armor>0){let sv=Math.floor(a*(P.atype===2?.5:1/3));if(sv>P.armor)sv=P.armor;P.armor-=sv;a-=sv;if(!P.armor)P.atype=0}

  if(P.hp<=0){P.hp=0;P.dead=true;P.deadT=0;sfx('pdie');msg('你阵亡了。')}else sfx('pain')}

  if(e.hp<=0){e.st='dead';e.dieF=0;G.kills++;sfx('mdie',e);const D=MON[e.type];
    if(D.drop==='clip')spawnItem('clip',e.x,e.y).drop=1;if(D.drop==='shotgun')spawnItem('shotgun',e.x,e.y).drop=1;
    if(D.boss)msg('守门者倒下了。出口已在眼前。');return}
  if(rand()<MON[e.type].pain&&e.st!=='atk'){e.st='pain';e.t=.22;sfx('mpain',e)}}
function explode(x,y,src,max){addFx('boom',x,y,.2,1.4,.5);sfx('boom',{x,y});G.shake=Math.min(.6,G.shake+.3/(1+Math.hypot(P.x-x,P.y-y)));
  const o={x,y};for(const e of[...ENTS,P]){if(e!==P&&!shootable(e))continue;const d=Math.hypot(e.x-x,e.y-y)-(e.r||.3);if(d<2&&los(o,e)){if(e.cls==='mon'&&MON[e.type].boss&&src===e)continue;damage(e,Math.round(max*(1-Math.max(0,d)/2)),src)}}}

function shoot(o,tx,ty,kind,dmg,spd,size){const a=Math.atan2(ty-o.y,tx-o.x);PROJ.push({x:o.x+Math.cos(a)*(o.r+.15),y:o.y+Math.sin(a)*(o.r+.15),z:o===P?.42:(o.z||0)+.55,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,kind,dmg,owner:o,size,life:6})}

// ===== monsters =====

  const spd=D.pspd*(NIGHT()?1.4:1);shoot(e,tg.x,tg.y,D.atk,ri(D.dmg[0],D.dmg[1]),spd,D.atk==='fball'?.35:.45);sfx('fire',e)}

  if(e.target&&(e.target.st==='dead'))e.target=null;
  const tg=e.target||P;
  if(e.st==='idle'){e.look-=dt;if(e.look<=0){e.look=.3;if(!P.dead&&Math.hypot(P.x-e.x,P.y-e.y)<26&&los(e,P))wake(e)}return}
  if(e.st==='pain'){e.t-=dt;if(e.t<=0)e.st='chase';return}

  if(e.st==='atk'){e.t-=dt;if(!e.fired&&e.t<=.3){e.fired=true;monAttack(e,tg,dist)}if(e.t<=0){e.st='chase';e.cd=(D.cd[0]+rand()*(D.cd[1]-D.cd[0]))*(NIGHT()?.5:1)}return}

  if(!see&&tg===P&&FLOW){const x=e.x|0,y=e.y|0,here=FLOW[y*MW+x];let best=here,bx=0,by=0;

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Dynamic Pong Wars — 对战模式</title>
  <meta name="description" content="Dynamic Pong Wars 双人挡板对战版">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;touch-action:none}
    body{font-family:ui-monospace,Consolas,monospace;display:flex;flex-direction:column;background:linear-gradient(#050505,#fff);color:#fff}
    main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:68px 10px 8px}
    .game{width:min(92vw,calc(100vh - 150px),700px);position:relative}
    canvas{width:100%;aspect-ratio:1;display:block;border-radius:8px;box-shadow:0 0 28px #0008;touch-action:none}
    #score{padding:10px 14px;text-align:center;background:#050505;border-radius:0 0 7px 7px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .help{position:absolute;left:0;right:0;bottom:43px;pointer-events:none;display:flex;justify-content:center;padding:9px;color:#fff;font-size:13px;text-shadow:0 1px 4px #000;background:linear-gradient(transparent,#0008)}
    #timer{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:#000b;color:#fff;padding:6px 13px;border-radius:18px;font:bold 20px/1 monospace;box-shadow:0 1px 6px #0008}
    #result{display:none;position:absolute;left:0;top:0;width:100%;aspect-ratio:1;z-index:5;grid-template-columns:1fr auto 1fr;align-items:center;background:#0004;pointer-events:none;text-shadow:0 3px 10px #000}
    #result.visible{display:grid}#result .win{font:bold clamp(28px,7vw,72px)/1 monospace;text-align:center;color:#fff;opacity:0}#result .win.show{opacity:1;animation:pulse .65s infinite alternate}
    #result .ratio{font:bold clamp(36px,9vw,92px)/1 monospace;color:#fff;white-space:nowrap;background:#000b;padding:14px 20px;border-radius:16px;border:2px solid #fff8}
    #result .draw{font-size:.48em;display:block;text-align:center;margin-bottom:8px;color:#ffc600}@keyframes pulse{to{transform:scale(1.08)}}
    .tools{position:fixed;right:15px;top:14px;display:flex;gap:10px;z-index:4}
    button{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111;font-size:21px;box-shadow:0 2px 8px #0007;cursor:pointer}
    #settings{position:fixed;left:15px;top:14px;display:flex;gap:7px;background:#111e;padding:7px 10px;border-radius:22px;z-index:4;font-size:12px;align-items:center;flex-wrap:nowrap;max-width:calc(100vw - 125px);white-space:nowrap}
    #settings label{display:flex;align-items:center;gap:3px;min-width:0}select{background:#fff;color:#111;border:0;border-radius:12px;padding:5px 7px;font:inherit;min-width:0}
    input[type=color]{width:27px;height:27px;border:0;padding:0;background:none}
    footer{flex:none;background:#050505;padding:10px;text-align:center;font-size:13px}
    footer a{color:#ffc600}
    @media(max-width:700px){main{padding:54px 4px 5px}.game{width:min(98vw,calc(100vh - 122px))}#settings{left:5px;top:6px;gap:4px;padding:5px 6px;max-width:calc(100vw - 101px);font-size:10px}#settings select{padding:4px 3px}#settings input[type=color]{width:21px;height:21px}.tools{right:5px;top:6px;gap:5px}.tools button{width:38px;height:38px;font-size:18px}.help{font-size:11px;padding:7px}#score{font-size:11px;padding:9px 5px}footer{padding:7px;font-size:12px}}
  </style>
</head>
<body>
  <div id="settings">
    <label>模式 <select id="mode"><option value="1">1人</option><option value="2">2人</option></select></label>
    <label id="difficultyLabel">难度 <select id="difficulty"><option value="simple">Simple</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
    <label>左 <input id="dayColor" type="color" value="#f3f0e8"></label><label>右 <input id="nightColor" type="color" value="#171717"></label>
  </div>
  <div class="tools"><button id="reset" aria-label="重置">↻</button><button id="pause" aria-label="暂停">Ⅱ</button></div>
  <main><div class="game">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="timer">100</div>
    <div id="result"><div id="leftWin" class="win">WIN!</div><div id="finalRatio" class="ratio"></div><div id="rightWin" class="win">WIN!</div></div>
    <div class="help"><span>请手指移动弹射板。</span><span id="rightHelp" hidden>AI：Simple</span></div>
    <div id="score"></div>
  </div></main>
  <footer>Original from <a href="https://markodenic.tech/dynamic-pong-wars/" target="_blank" rel="noopener">Marko Denic</a></footer>
<script>
const canvas=document.querySelector('#gameCanvas'),ctx=canvas.getContext('2d'),score=document.querySelector('#score'),timerEl=document.querySelector('#timer'),resultEl=document.querySelector('#result'),finalRatio=document.querySelector('#finalRatio'),leftWin=document.querySelector('#leftWin'),rightWin=document.querySelector('#rightWin');
const TILE=25,R=TILE/2,GRID=24,PADDLE_H=R*8,PADDLE_W=26,PADDLE_MARGIN=7;
const WALL_MAX=10,BALL_MIN=5,BALL_MAX=18,PADDLE_BOOST=1.25,MOMENTUM=0.20;
let leftColor='#f3f0e8',rightColor='#171717',playing=true,last=performance.now(),gameMode='1',difficulty='simple',aiThink=0,timeLeft=100,gameOver=false;
let audioCtx=null;
function unlockAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(from,to,duration,volume=.12,delay=0,type='sine'){if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+duration);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+duration)}
function playPaddleSound(){tone(230,480,.09,.10,0,'square')}
function playExplosionSound(){if(!audioCtx)return;tone(150,42,.34,.18,0,'sawtooth');const length=Math.floor(audioCtx.sampleRate*.28),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();filter.type='lowpass';filter.frequency.value=700;gain.gain.value=.16;src.buffer=buffer;src.connect(filter).connect(gain).connect(audioCtx.destination);src.start()}
function playVictorySound(winner){[392,523,659,784].forEach((f,i)=>tone(f,f*1.02,.28,.11,i*.12,'triangle'));if('speechSynthesis'in window){speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(winner===0?'左营胜利':winner===1?'右营胜利':'双方平局');msg.lang='zh-CN';msg.rate=.9;msg.pitch=1.05;msg.volume=.9;setTimeout(()=>speechSynthesis.speak(msg),520)}}
const ownership=Array(GRID*GRID).fill(0).map((_,i)=>i%GRID<GRID/2?0:1);
const neutralTiles=new Map();
const explosions=[];
const paddles=[{side:0,x:PADDLE_MARGIN,y:250,vy:0,target:250},{side:1,x:600-PADDLE_MARGIN-PADDLE_W,y:250,vy:0,target:250}];
const balls=[
  {x:150,y:300,vx:7.2,vy:-6.5,side:0,neutralHit:-1},
  {x:450,y:300,vx:-7.2,vy:6.5,side:1,neutralHit:-1}
];
const keys=new Set();
function colorFor(side){return side===0?leftColor:rightColor}
function opponentColor(side){return side===0?rightColor:leftColor}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function capBall(b){const s=Math.hypot(b.vx,b.vy)||1;if(s>BALL_MAX){b.vx*=BALL_MAX/s;b.vy*=BALL_MAX/s}if(s<BALL_MIN){b.vx*=BALL_MIN/s;b.vy*=BALL_MIN/s}}
function reset(){if('speechSynthesis'in window)speechSynthesis.cancel();ownership.forEach((_,i)=>ownership[i]=i%GRID<GRID/2?0:1);neutralTiles.clear();explosions.length=0;Object.assign(balls[0],{x:150,y:300,vx:7.2,vy:-6.5,neutralHit:-1});Object.assign(balls[1],{x:450,y:300,vx:-7.2,vy:6.5,neutralHit:-1});paddles.forEach(p=>{p.y=250;p.target=250;p.vy=0});timeLeft=100;gameOver=false;timerEl.textContent='100';resultEl.classList.remove('visible');leftWin.classList.remove('show');rightWin.classList.remove('show');if(!playing)toggle()}
function toggle(){if(gameOver)return;playing=!playing;document.querySelector('#pause').textContent=playing?'Ⅱ':'▶';last=performance.now();if(playing)requestAnimationFrame(frame)}
function moveAI(dt){
  const cfg={simple:{speed:235,reaction:.20,error:48},medium:{speed:400,reaction:.10,error:22},hard:{speed:620,reaction:.035,error:5}}[difficulty];
  aiThink-=dt;
  if(aiThink<=0){
    aiThink=cfg.reaction;
    const candidates=balls.filter(b=>b.vx>0).sort((a,b)=>b.x-a.x),target=candidates[0]||balls.reduce((a,b)=>a.x>b.x?a:b);
    const travel=Math.max(0,(paddles[1].x-target.x)/Math.max(1,target.vx));
    let predicted=target.y+target.vy*travel;
    while(predicted<0||predicted>600){if(predicted<0)predicted=-predicted;if(predicted>600)predicted=1200-predicted}
    paddles[1].aiTarget=predicted-PADDLE_H/2+(Math.random()*2-1)*cfg.error;
  }
  const delta=clamp((paddles[1].aiTarget??250)-paddles[1].target,-cfg.speed*dt,cfg.speed*dt);paddles[1].target+=delta;
}
function movePaddles(dt){const speed=780,old=paddles.map(p=>p.y);if(keys.has('KeyW'))paddles[0].target-=speed*dt;if(keys.has('KeyS'))paddles[0].target+=speed*dt;if(gameMode==='2'){if(keys.has('ArrowUp'))paddles[1].target-=speed*dt;if(keys.has('ArrowDown'))paddles[1].target+=speed*dt}else moveAI(dt);paddles.forEach((p,i)=>{p.target=clamp(p.target,0,600-PADDLE_H);p.y+=(p.target-p.y)*Math.min(1,dt*24);p.vy=(p.y-old[i])/Math.max(dt,1/240)})}
function neutralCount(type){let n=0;neutralTiles.forEach(v=>{if(v.type===type)n++});return n}
function spawnNeutral(type){
  if(neutralCount(type)>=5)return false;
  const candidates=[];for(let i=0;i<ownership.length;i++)if(ownership[i]===type&&!neutralTiles.has(i))candidates.push(i);
  if(!candidates.length)return false;const idx=candidates[Math.floor(Math.random()*candidates.length)];neutralTiles.set(idx,{type,bornAt:performance.now()});return true;
}
function explodeNeutral(b,idx,gx,gy){
  const speed=clamp(Math.hypot(b.vx,b.vy)*1.03,BALL_MIN,BALL_MAX);
  const angle=(45+Math.random()*90)*Math.PI/180;
  const horizontal=b.vx>=0?-1:1,vertical=Math.random()<.5?-1:1;
  b.vx=horizontal*Math.abs(Math.cos(angle))*speed;b.vy=vertical*Math.abs(Math.sin(angle))*speed;
  if(Math.abs(b.vx)<speed*.18)b.vx=horizontal*speed*.18;
  capBall(b);neutralTiles.delete(idx);explosions.push({x:gx*TILE+R,y:gy*TILE+R,bornAt:performance.now()});playExplosionSound();b.neutralHit=idx;
  const dx=b.x-(gx*TILE+R),dy=b.y-(gy*TILE+R);
  Math.abs(dx)>Math.abs(dy)?b.x+=Math.sign(dx||1)*3:b.y+=Math.sign(dy||1)*3;
}
function tileCollisions(b){
  const minX=clamp(Math.floor((b.x-R)/TILE),0,GRID-1),maxX=clamp(Math.floor((b.x+R)/TILE),0,GRID-1),minY=clamp(Math.floor((b.y-R)/TILE),0,GRID-1),maxY=clamp(Math.floor((b.y+R)/TILE),0,GRID-1);let touchingNeutral=false;
  for(let gy=minY;gy<=maxY;gy++)for(let gx=minX;gx<=maxX;gx++){
    const i=gy*GRID+gx;
    if(neutralTiles.has(i)){touchingNeutral=true;const tile=neutralTiles.get(i);if(performance.now()-tile.bornAt>=5000&&b.neutralHit!==i)explodeNeutral(b,i,gx,gy);continue}
    if(ownership[i]===b.side)continue;
    ownership[i]=b.side;if(neutralCount(b.side)<5)spawnNeutral(b.side);const dx=b.x-(gx*TILE+R),dy=b.y-(gy*TILE+R);Math.abs(dx)>Math.abs(dy)?b.vx*=-1:b.vy*=-1;
  }
  if(!touchingNeutral)b.neutralHit=-1;
}
function paddleCollision(b,p){const movingToward=p.side===0?b.vx<0:b.vx>0;if(!movingToward)return;const hitX=b.x+R>p.x&&b.x-R<p.x+PADDLE_W,hitY=b.y+R>p.y&&b.y-R<p.y+PADDLE_H;if(!hitX||!hitY)return;const incoming=Math.hypot(b.vx,b.vy),speed=clamp(incoming*PADDLE_BOOST,BALL_MIN,BALL_MAX);const offset=clamp((b.y-(p.y+PADDLE_H/2))/(PADDLE_H/2),-1,1);const angle=offset*1.05,dir=p.side===0?1:-1;b.vx=dir*Math.max(3,Math.cos(angle)*speed);b.vy=Math.sin(angle)*speed+p.vy*MOMENTUM;b.x=p.side===0?p.x+PADDLE_W+R:p.x-R;capBall(b);playPaddleSound()}
function wallCollision(b){if(b.y<R){b.y=R;b.vy=Math.abs(b.vy)}if(b.y>600-R){b.y=600-R;b.vy=-Math.abs(b.vy)}if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)}if(b.x>600-R){b.x=600-R;b.vx=-Math.abs(b.vx)}const s=Math.hypot(b.vx,b.vy);if(s>WALL_MAX&&!paddles.some(p=>Math.abs(b.x-p.x)<PADDLE_W+R+4)){b.vx*=WALL_MAX/s;b.vy*=WALL_MAX/s}}
function updateBall(b,dt){b.vx+=(Math.random()-.5)*.012;b.vy+=(Math.random()-.5)*.012;const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt*60/R));for(let i=0;i<steps;i++){b.x+=b.vx*dt*60/steps;b.y+=b.vy*dt*60/steps;paddles.forEach(p=>paddleCollision(b,p));tileCollisions(b);wallCollision(b)}}
function ballCollision(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);if(!dist||dist>R*2)return;
  const nx=dx/dist,ny=dy/dist,rvx=b.vx-a.vx,rvy=b.vy-a.vy,closing=rvx*nx+rvy*ny;if(closing>=0)return;
  a.vx+=closing*nx;a.vy+=closing*ny;b.vx-=closing*nx;b.vy-=closing*ny;
  const overlap=R*2-dist;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;capBall(a);capBall(b);
}
function drawNeutral(i,tile){const x=i%GRID*TILE,y=Math.floor(i/GRID)*TILE,mirror=tile.type===1,arming=Math.min(1,(performance.now()-tile.bornAt)/5000);ctx.save();ctx.globalAlpha=.45+.55*arming;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+TILE,y);ctx.lineTo(x,y+TILE);ctx.closePath();ctx.fillStyle=mirror?rightColor:leftColor;ctx.fill();ctx.beginPath();ctx.moveTo(x+TILE,y);ctx.lineTo(x+TILE,y+TILE);ctx.lineTo(x,y+TILE);ctx.closePath();ctx.fillStyle=mirror?leftColor:rightColor;ctx.fill();ctx.strokeStyle=arming>=1?'#ffb000':'#888';ctx.lineWidth=arming>=1?2:1;ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);ctx.restore()}
function drawExplosions(){const now=performance.now();for(let i=explosions.length-1;i>=0;i--){const e=explosions[i],p=(now-e.bornAt)/520;if(p>=1){explosions.splice(i,1);continue}ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle='#ffb000';ctx.lineWidth=3*(1-p)+1;ctx.beginPath();ctx.arc(e.x,e.y,5+p*35,0,Math.PI*2);ctx.stroke();for(let n=0;n<8;n++){const a=n*Math.PI/4,r=7+p*42;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*r*.55,e.y+Math.sin(a)*r*.55);ctx.lineTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);ctx.stroke()}ctx.restore()}}
function drawPaddle(p){const x=p.x,y=p.y,w=PADDLE_W,h=PADDLE_H,cut=PADDLE_W;ctx.beginPath();if(p.side===0){ctx.moveTo(x,y);ctx.lineTo(x+w,y+cut);ctx.lineTo(x+w,y+h-cut);ctx.lineTo(x,y+h)}else{ctx.moveTo(x,y+cut);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h-cut)}ctx.closePath();ctx.fillStyle=p.side===0?rightColor:leftColor;ctx.shadowColor='#fff';ctx.shadowBlur=7;ctx.fill();ctx.shadowBlur=0}
function draw(){let ls=0,rs=0;for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const i=y*GRID+x,side=ownership[i];ctx.fillStyle=colorFor(side);ctx.fillRect(x*TILE,y*TILE,TILE,TILE);if(neutralTiles.has(i))drawNeutral(i,neutralTiles.get(i));else side?rs++:ls++}drawExplosions();balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fillStyle=opponentColor(b.side);ctx.fill()});paddles.forEach(drawPaddle);score.textContent=`左方 ${ls}　|　右方 ${rs}　·　双色区 ${neutralCount(0)}＋${neutralCount(1)}`}
function getScores(){let left=0,right=0;ownership.forEach((side,i)=>{if(neutralTiles.has(i))return;side?right++:left++});return{left,right}}
function endGame(){gameOver=true;playing=false;document.querySelector('#pause').textContent='▶';timerEl.textContent='0';const s=getScores(),winner=s.left>s.right?0:s.right>s.left?1:-1;finalRatio.textContent=`${s.left} : ${s.right}`;leftWin.classList.toggle('show',winner===0);rightWin.classList.toggle('show',winner===1);if(winner<0)finalRatio.innerHTML=`<span class="draw">DRAW</span>${s.left} : ${s.right}`;resultEl.classList.add('visible');playVictorySound(winner)}
function frame(t){if(!playing)return;const dt=Math.min(.03,(t-last)/1000||.016);last=t;timeLeft=Math.max(0,timeLeft-dt);timerEl.textContent=String(Math.ceil(timeLeft));movePaddles(dt);balls.forEach(b=>updateBall(b,dt));ballCollision(balls[0],balls[1]);draw();if(timeLeft<=0){endGame();return}requestAnimationFrame(frame)}
function pointerMove(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;if(gameMode==='1'&&x>=300)return;const p=x<300?paddles[0]:paddles[1];p.target=clamp(y-PADDLE_H/2,0,600-PADDLE_H);e.preventDefault()}
canvas.addEventListener('pointerdown',e=>{unlockAudio();canvas.setPointerCapture(e.pointerId);pointerMove(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointerMove(e)});
addEventListener('keydown',e=>{unlockAudio();if(['KeyW','KeyS','ArrowUp','ArrowDown'].includes(e.code)){keys.add(e.code);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.code));
document.querySelector('#reset').onclick=reset;document.querySelector('#pause').onclick=toggle;
document.querySelector('#mode').onchange=e=>{gameMode=e.target.value;document.querySelector('#difficultyLabel').style.display=gameMode==='1'?'flex':'none';document.querySelector('#rightHelp').textContent=gameMode==='1'?`AI：${difficulty[0].toUpperCase()+difficulty.slice(1)}`:'玩家2：↑ / ↓ 或右侧拖动';aiThink=0;reset()};
document.querySelector('#difficulty').onchange=e=>{difficulty=e.target.value;document.querySelector('#rightHelp').textContent=`AI：${difficulty[0].toUpperCase()+difficulty.slice(1)}`;aiThink=0};
document.querySelector('#dayColor').oninput=e=>{leftColor=e.target.value;document.body.style.background=`linear-gradient(${rightColor},${leftColor})`};
document.querySelector('#nightColor').oninput=e=>{rightColor=e.target.value;document.body.style.background=`linear-gradient(${rightColor},${leftColor})`};
requestAnimationFrame(frame);
</script>
</body></html>
